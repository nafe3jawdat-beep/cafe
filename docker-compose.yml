services:
  postgres:
    image: postgres:16-alpine
    container_name: cafe-qr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cafe
      POSTGRES_PASSWORD: cafe_dev_password
      POSTGRES_DB: cafe_qr
    ports:
      - "5432:5432"
    volumes:
      - cafe_qr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafe -d cafe_qr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cafe_qr_pgdata:
